services:
  - type: web
    name: preppilot-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL, e.g. https://preppilot-ai.vercel.app
      - key: SUPABASE_URL
        sync: false          # Optional
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Optional

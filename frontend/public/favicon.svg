<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg32" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1060"/>
      <stop offset="100%" stop-color="#0d0828"/>
    </radialGradient>
    <linearGradient id="p32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cap32" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow32" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg32)"/>

  <!-- Subtle inner glow -->
  <ellipse cx="16" cy="17" rx="11" ry="10" fill="#4c1d95" fill-opacity="0.25"/>

  <!-- P letter glow layer -->
  <text x="4" y="29"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="30"
        fill="url(#p32)"
        opacity="0.35"
        filter="url(#glow32)">P</text>

  <!-- P letter main -->
  <text x="4" y="29"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="30"
        fill="url(#p32)">P</text>

  <!-- Graduation cap mortarboard plate -->
  <rect x="8" y="4.5" width="16" height="1.6" rx="0.4" fill="url(#cap32)" opacity="0.95"/>
  <!-- Cap top (diamond) -->
  <polygon points="16,1 24,4.5 16,7 8,4.5" fill="url(#cap32)" opacity="0.95"/>
  <!-- Cap band -->
  <rect x="12" y="7" width="8" height="3.5" rx="0.8" fill="#c4b5fd" opacity="0.9"/>
  <!-- Tassel string -->
  <line x1="24" y1="4.5" x2="26.5" y2="8" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <circle cx="26.5" cy="9" r="1" fill="#e9d5ff" opacity="0.8"/>
  <!-- Tassel fringe -->
  <line x1="26.5" y1="10" x2="25.5" y2="12.5" stroke="#c4b5fd" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="26.5" y1="10" x2="26.5" y2="12.5" stroke="#c4b5fd" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="26.5" y1="10" x2="27.5" y2="12.5" stroke="#c4b5fd" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

  <!-- Small star sparkle inside P bowl -->
  <path d="M22,13 L22.8,15.4 L25.2,16.2 L22.8,17 L22,19.4 L21.2,17 L18.8,16.2 L21.2,15.4 Z"
        fill="white" opacity="0.85" filter="url(#glow32)"/>

  <!-- Cyan orbital arc hint -->
  <path d="M5,19 Q16,13 27,19" fill="none" stroke="#06b6d4" stroke-width="0.9"
        stroke-linecap="round" opacity="0.55"/>
</svg>

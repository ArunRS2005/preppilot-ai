<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <!-- Icon background gradient -->
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1060"/>
      <stop offset="100%" stop-color="#0d0828"/>
    </radialGradient>

    <!-- P gradient -->
    <linearGradient id="pGradFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- "AI" text gradient -->
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- PrepPilot text gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="capGradFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Orbital gradient -->
    <linearGradient id="orbitGradFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- P soft glow -->
    <filter id="pGlowFull" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Icon outer glow -->
    <filter id="iconGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#7c3aed" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Star glow small -->
    <filter id="starGlowSmall" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ═══ ICON (0,0 to 90,100) ═══ -->
  <g filter="url(#iconGlow)">
    <!-- Background rounded square -->
    <rect x="5" y="8" width="80" height="84" rx="16" fill="url(#iconBg)"/>

    <!-- Inner glow -->
    <ellipse cx="45" cy="52" rx="30" ry="28" fill="#4c1d95" fill-opacity="0.2"/>

    <!-- Orbital rings -->
    <ellipse cx="45" cy="56" rx="30" ry="13"
             fill="none" stroke="url(#orbitGradFull)" stroke-width="1.5"
             stroke-dasharray="56 42"
             transform="rotate(-22 45 56)"/>
    <ellipse cx="45" cy="56" rx="30" ry="13"
             fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"
             stroke-dasharray="38 60"
             stroke-dashoffset="14"
             transform="rotate(22 45 56)"/>

    <!-- Orbital nodes -->
    <circle cx="17" cy="51" r="1.5" fill="#06b6d4" opacity="0.9"/>
    <circle cx="73" cy="61" r="1.2" fill="#06b6d4" opacity="0.7"/>

    <!-- P letter glow -->
    <text x="21" y="85"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-weight="900" font-size="62"
          fill="url(#pGradFull)"
          filter="url(#pGlowFull)"
          opacity="0.4">P</text>
    <!-- P letter main -->
    <text x="21" y="85"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-weight="900" font-size="62"
          fill="url(#pGradFull)">P</text>

    <!-- Graduation cap -->
    <!-- Cap board -->
    <rect x="30" y="13" width="30" height="2.8" rx="0.8" fill="url(#capGradFull)" opacity="0.95"/>
    <!-- Cap top (diamond) -->
    <polygon points="45,5 60,13 45,17.5 30,13" fill="url(#capGradFull)" opacity="0.95"/>
    <!-- Cap band -->
    <rect x="37" y="17.5" width="16" height="7" rx="1.2" fill="#c4b5fd" opacity="0.9"/>
    <!-- Tassel -->
    <line x1="60" y1="13" x2="65" y2="21" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="65" cy="23" r="1.8" fill="#e9d5ff" opacity="0.85"/>
    <line x1="65" y1="25" x2="63" y2="30" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
    <line x1="65" y1="25" x2="65" y2="30" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
    <line x1="65" y1="25" x2="67" y2="30" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.65"/>

    <!-- Star sparkle inside P counter -->
    <g filter="url(#starGlowSmall)">
      <path d="M57,41 L58.4,46 L63.5,47.4 L58.4,48.8 L57,53.8 L55.6,48.8 L50.5,47.4 L55.6,46 Z"
            fill="white" opacity="0.9"/>
    </g>

    <!-- Accent dots -->
    <circle cx="72" cy="27" r="1.2" fill="white" opacity="0.4"/>
    <circle cx="16" cy="72" r="1" fill="#c4b5fd" opacity="0.4"/>
  </g>

  <!-- ═══ TEXT SECTION ═══ -->
  <!-- "PrepPilot" text -->
  <text x="98" y="52"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="30"
        letter-spacing="-0.5"
        fill="url(#textGrad)"
        filter="url(#textGlow)">PrepPilot</text>

  <!-- "AI" text with violet gradient -->
  <text x="284" y="52"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="30"
        letter-spacing="1"
        fill="url(#aiGrad)"
        filter="url(#textGlow)">AI</text>

  <!-- Subtitle -->
  <text x="98" y="70"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="8"
        letter-spacing="1.8"
        fill="#94a3b8"
        opacity="0.85">YOUR AI INTERVIEW INTELLIGENCE SYSTEM</text>

  <!-- Subtle separator line between name and subtitle -->
  <line x1="98" y1="57" x2="390" y2="57" stroke="#4c1d95" stroke-width="0.5" opacity="0.4"/>
</svg>
